name: Preview screenshot

# Takes gascity/preview.png from a real run (canary/mod-linux.sh): gc built
# from the commit in api/PIN runs a scratch city, the released herdr-app runs
# headless on Xvfb, install.sh installs the mod and opens its tab, and
# `herdr-app shot` captures the window. The image is uploaded as an artifact;
# a person reviews it and commits it as gascity/preview.png.
#
# This job runs herdr's published install.sh, gc built from source and the Go
# modules it pulls: it is never given a secret, and it never runs in main's
# context (no dispatch, no schedule, no push to main), so nothing it could
# write to the Actions cache is in a scope main, a tag or a release can read.
# To refresh the preview, push a branch that touches one of the paths below
# (a change to the built mod does).

on:
  push:
    branches-ignore: [main]
    # The run installs the mod with install.sh, so it also checks the installer.
    paths:
      - .github/workflows/preview.yml
      - canary/mod-linux.sh
      - gascity/main.js
      - install.sh
      - scripts/package.ts

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Mod preview (ubuntu-24.04, Xvfb, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HC_SESSION: canary
      CANARY_DISPLAY: xvfb
      GASCITY_SRC: ${{ github.workspace }}/gascity-src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: The pinned gascity commit
        id: pin
        run: |
          commit=$(sed -n 's/^commit=//p' api/PIN)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || { echo "::error::api/PIN has no commit"; exit 1; }
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: gastownhall/gascity
          ref: ${{ steps.pin.outputs.commit }}
          path: gascity-src
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gascity-src/go.mod
          # No cache: nothing this job downloads may be restored by another run.
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # The binary is never cached: a cache saved by a workflow that runs
          # downloaded code could be restored by the release build.
          no-cache: true

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Preflight (packages, lavapipe)
        timeout-minutes: 6
        run: |
          canary/bootstrap-linux.sh preflight
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libicu-dev

      - name: Resolve current stable release
        id: resolve
        timeout-minutes: 2
        run: canary/bootstrap-linux.sh resolve

      - name: Restore release mirror
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-canary/mirror-cache
          key: herdr-mirror-${{ steps.resolve.outputs.target }}-app${{ steps.resolve.outputs.app }}-core${{ steps.resolve.outputs.core }}

      - name: Fill and serve release mirror
        timeout-minutes: 3
        run: canary/bootstrap-linux.sh mirror

      - name: Install herdr-app via published install.sh
        timeout-minutes: 3
        run: canary/bootstrap-linux.sh install

      - name: Build gc at the pinned commit
        timeout-minutes: 12
        run: canary/mod-linux.sh gc

      - name: Scratch city
        timeout-minutes: 4
        run: canary/mod-linux.sh city

      - name: Display (Xvfb)
        timeout-minutes: 2
        run: canary/bootstrap-linux.sh display

      - name: App up, status, space.new
        timeout-minutes: 2
        run: canary/bootstrap-linux.sh app

      - name: Package the mod
        timeout-minutes: 2
        run: canary/mod-linux.sh package

      - name: Install the mod with install.sh
        timeout-minutes: 3
        run: canary/mod-linux.sh install

      - name: The mod connected to the city
        timeout-minutes: 3
        run: canary/mod-linux.sh connected

      - name: Screenshot
        timeout-minutes: 4
        run: canary/mod-linux.sh shot preview.png

      - name: Teardown
        if: always()
        timeout-minutes: 2
        run: |
          canary/mod-linux.sh teardown
          canary/bootstrap-linux.sh teardown

      - name: Result
        if: always()
        run: canary/result.sh preflight resolve mirror install-app gc city display app package install-mod connected shot

      - name: Upload the preview and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gascity-preview-${{ github.run_attempt }}
          path: ${{ runner.temp }}/herdr-canary/out
          if-no-files-found: error
          retention-days: 14
